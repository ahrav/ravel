  #           expected="$2"
  #           $TLC -config "ControllerHead_$1.cfg" ControllerHead.tla > "out_$1.txt" 2>&1 || true
  #           grep -qF "Invariant $expected is violated" "out_$1.txt" \
  #             || { echo "ControllerHead_$1.cfg did not violate $expected" >&2
  #                  tail -40 "out_$1.txt" >&2; exit 1; }
  #         }
  #         check_violation NC1 ResolutionSound
  #         check_violation NC2 EpochMonotonic
  #         check_violation NC3 FencingOrder
  #         check_violation NC4 ResolutionSound
  #         check_violation Witnesses WitnessesIncomplete
  #
  #     - name: Full model check (safety + liveness)
  #       run: |
  #         set -euo pipefail
  #         cd specs/tla
  #         JAR="$RUNNER_TEMP/tla2tools.jar"
  #         TLC="java -XX:+UseParallelGC -cp $JAR tlc2.TLC -workers auto"
  #         $TLC -coverage 5 -config ControllerHead_Safety.cfg ControllerHead.tla
  #         $TLC -lncheck final -config ControllerHead_Liveness.cfg ControllerHead.tla

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disable ambient AWS credential providers (IMDS and config files).
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install aarch64 cross compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Check aarch64 target
        run: cargo check --locked --target aarch64-unknown-linux-gnu

      - name: Check x86_64 target
        run: cargo check --locked --target x86_64-unknown-linux-gnu

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test ignored gates
        # VmHWM is process-wide, so the RSS gate cannot share a process with the
        # replay growth gate that libtest would otherwise run concurrently.
        run: cargo test --locked -- --ignored --test-threads=1
