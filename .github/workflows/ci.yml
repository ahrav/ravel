name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disable ambient AWS credential providers (IMDS and config files).
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install aarch64 cross compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Check aarch64 target
        run: cargo check --locked --target aarch64-unknown-linux-gnu

      - name: Check x86_64 target
        run: cargo check --locked --target x86_64-unknown-linux-gnu

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # TLA+ model check for specs/tla/ControllerHead.tla. Landed disabled: the
      # safety run is ~10^8 distinct states (minutes on 32 cores, far longer on a
      # 2-core runner). To enable, uncomment this step (drop the leading "# ").
      # A cheaper enable path is the second half alone (SANY + the negative
      # controls and witnesses), whose traces are all under 25 states.
