  # in its OWN job because it cannot fit the `check` job's 30-minute timeout: on
  # the 32-core reference machine the safety run takes 12min 40s and the liveness
  # run 1h 10min (specs/tla/README.md §5), and a 2-core hosted runner is much
  # slower still. To enable, uncomment this job (drop the leading "# "); 360 is
  # the hosted-runner ceiling, so re-time the full run on the runner you use
  # before trusting it as a gate.
  #
  # Cheap enable path: uncomment the job and drop the "Full model check" step.
  # The controls and witnesses have traces under 25 states and finish in seconds,
  # and SANY still parses the spec.
