      #     $TLC -lncheck final -config ControllerHead_Liveness.cfg ControllerHead.tla
      #     # Negative controls and witnesses MUST fail, and must fail for the
      #     # NAMED reason: any other nonzero exit (parse error, OOM, full tmpdir)
      #     # would otherwise pass this gate silently.
