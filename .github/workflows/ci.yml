  #   runs-on: ubuntu-latest
  #   timeout-minutes: 360
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #       with:
  #         fetch-depth: 1
  #         persist-credentials: false
  #
  #     - name: Fetch TLC
  #       run: |
  #         set -euo pipefail
  #         curl -sSLo "$RUNNER_TEMP/tla2tools.jar" \
  #           https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  #         echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" \
  #           | sha256sum --check --strict
  #
  #     - name: Negative controls and witnesses
  #       run: |
  #         set -euo pipefail
  #         cd specs/tla
  #         JAR="$RUNNER_TEMP/tla2tools.jar"
  #         TLC="java -XX:+UseParallelGC -cp $JAR tlc2.TLC -workers auto"
  #         java -cp "$JAR" tla2sany.SANY ControllerHead.tla
  #         # These MUST fail, and must fail for the NAMED reason: any other
  #         # nonzero exit (parse error, OOM, full tmpdir) would otherwise pass
  #         # this gate silently.
