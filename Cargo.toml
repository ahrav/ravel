[package]
name = "ravel"
version = "0.1.0"
edition = "2024"
publish = false
# Exactly one binary: with autobins off, src/bin/*.rs cannot silently add more.
autobins = false

[[bin]]
name = "ravel"
path = "src/main.rs"

[dependencies]
# S3 requests use the official AWS SDK with the Tokio HTTPS client.
aws-sdk-s3 = { version = "=1.135.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
# The event format uses deterministic CBOR encoding.
ciborium = "=0.2.2"
# Instance identity generation reads operating-system randomness.
getrandom = "=0.4.3"
# Disposable projections use bundled SQLite on both CI targets.
rusqlite = { version = "=0.40.2", default-features = false, features = [
  "bundled",
] }
# Wire serialization uses serde derives.
serde = { version = "=1.0.228", features = ["derive"] }
# Head records use canonical JSON bytes.
serde_json = "=1.0.146"
# Stored event bytes use SHA-256 digests.
sha2 = "=0.10.9"
# The database worker returns each async reply through a one-shot channel.
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }
# Event records use zstd compression.
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
# Concurrent-fetch tests key scripted responses by request URI instead of arrival order.
aws-smithy-http-client = { version = "=1.2.0", default-features = false, features = [
  "test-util",
] }
aws-config = { version = "=1.10.1", default-features = false, features = [
  "behavior-version-latest",
  "credentials-process",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-s3 = { version = "=1.135.0", default-features = false, features = [
  "test-util",
] }
aws-sdk-sts = { version = "=1.110.0", default-features = false }
aws-smithy-runtime = { version = "=1.12.1", default-features = false, features = [
  "test-util",
] }
bytes = "=1.12.1"
http = "=1.4.2"
http-body = "=1.1.0"
tokio = { version = "=1.53.1", default-features = false, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "time",
] }
