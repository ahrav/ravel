[package]
name = "ravel"
version = "0.1.0"
edition = "2024"
publish = false
# Exactly one binary: with autobins off, src/bin/*.rs cannot silently add more.
autobins = false

[[bin]]
name = "ravel"
path = "src/main.rs"

[dependencies]
# The event format uses deterministic v1 CBOR encoding.
ciborium = "=0.2.2"
# Stored event bytes use SHA-256 digests.
sha2 = "=0.10.9"
# Wire serialization uses serde derives.
serde = { version = "=1.0.228", features = ["derive"] }
# Head records use canonical JSON bytes.
serde_json = "=1.0.145"
# Intentionally unused: pins the async runtime required by the AWS SDK client.
tokio = { version = "=1.53.1", default-features = false }
# Event records use zstd compression.
zstd = { version = "=0.13.3", default-features = false }
