\* Final liveness run.  NO SYMMETRY and NO CONSTRAINT (both are unsound or
\* dangerous with liveness -- tla-spec Soundness Matrix); run with
\* -lncheck final.  Expected: no error.
\* Smaller bounds than the safety run: liveness checking builds the full state
\* graph plus a behaviour graph, so the epoch/term budget is cut to 3.
SPECIFICATION LiveSpec

INVARIANT TypeOK

PROPERTY TransitionResolves
PROPERTY AcquisitionProgress

CONSTANT Controller = {c1, c2}
CONSTANT MaxInc = 2
CONSTANT MaxEpoch = 3
CONSTANT MaxTerm = 3
CONSTANT MaxTail = 1
CONSTANT MaxReq = 2
CONSTANT ResolveIgnoresEpoch = FALSE
CONSTANT BlindRetry = FALSE
CONSTANT FencingOff = FALSE
