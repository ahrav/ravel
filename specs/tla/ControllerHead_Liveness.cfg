\* Final liveness run.  NO SYMMETRY and NO CONSTRAINT (both are unsound or
\* dangerous with liveness -- tla-spec Soundness Matrix); run with
\* -lncheck final.  Expected: no error.
\* MaxEpoch must leave budget for a handoff AFTER a release (genesis 1 ->
\* acquire 2 -> release 3 -> successor acquires 4), otherwise
\* AcquisitionProgress is satisfied only through its Exhausted escape and the
\* release-handoff case is never checked.
SPECIFICATION LiveSpec

INVARIANT TypeOK

PROPERTY TransitionResolves
PROPERTY AcquisitionProgress

CONSTANT Controller = {c1, c2}
CONSTANT MaxInc = 2
CONSTANT MaxEpoch = 4
CONSTANT MaxTerm = 4
CONSTANT MaxTail = 1
CONSTANT MaxReq = 2
CONSTANT ResolveIgnoresEpoch = FALSE
CONSTANT BlindRetry = FALSE
CONSTANT FencingOff = FALSE
CONSTANT IgnoreIncarnation = FALSE
